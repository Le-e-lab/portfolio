<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lesley Mutsambiwa">
  <!--
    Brand mark. Master for favicon-16/32/192/512, apple-touch-icon and

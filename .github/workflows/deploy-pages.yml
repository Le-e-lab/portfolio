name: Deploy to GitHub Pages

# Pages for this repo has build_type "workflow", so it publishes the artifact
# this workflow uploads — not the gh-pages branch. It previously served a
# September artifact because the workflow that built it was no longer in the
# repo, and nothing had rebuilt since.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # No packageManager field in package.json, so pnpm must be pinned.
          # 11.5.2 is the version verified against this lockfile.
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm run build:pages
        env:
          # public/CNAME claims this domain, so Pages serves it at the root and
          # no basePath is needed.
          NEXT_PUBLIC_SITE_URL: https://lesley.runs-on.dev

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
